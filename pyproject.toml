[project]
name = "carvera-simulator-gui"
version = "0.1.0"
description = "NiceGUI front end for the Carvera firmware simulator"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=3.12.1",
    "protobuf>=7.35.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
extend-exclude = ["gui/generated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
exclude = ["gui/generated/"]

[tool.pytest.ini_options]
markers = [
    "integration: launches built simulator binaries",
]

[dependency-groups]
dev = [
    "gcovr>=8.0",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
    "types-protobuf>=7.34.1.20260518",
]
package = [
    "pyinstaller>=6.20.0",
    "pywebview>=6.2.1",
]
package-linux = [
    "pyinstaller>=6.20.0",
]
