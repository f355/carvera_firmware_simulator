name: CI

on:
  pull_request:
  push:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: macos-latest
            experimental: false
          - os: windows-latest
            experimental: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        if: runner.os != 'Windows'
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v7
        if: runner.os != 'Windows'
        with:
          enable-cache: true

      - uses: Vampire/setup-wsl@v7
        if: runner.os == 'Windows'
        with:
          distribution: Ubuntu-24.04
          update: "true"
          additional-packages: >
            build-essential
            ca-certificates
            cmake
            curl
            git
            libprotobuf-dev
            ninja-build
            protobuf-compiler
            python3
            python3-venv

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build protobuf-compiler libprotobuf-dev

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install cmake ninja protobuf

      - name: Fetch compatible firmware
        if: runner.os != 'Windows'
        run: echo "FIRMWARE_ROOT=$(scripts/ensure_firmware_checkout.sh)" >> "$GITHUB_ENV"

      - name: Detect build parallelism
        if: runner.os != 'Windows'
        run: python -c "import os; open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write(f'CMAKE_BUILD_PARALLEL_LEVEL={os.cpu_count() or 4}\n')"

      - name: Sync Python environment
        if: runner.os != 'Windows'
        run: uv sync

      - name: Generate Python protobuf bindings
        if: runner.os != 'Windows'
        run: uv run python -m gui.protocol.proto_codegen

      - name: Check Python
        if: runner.os != 'Windows'
        run: |
          uv run ruff format --check gui
          uv run ruff check gui
          uv run mypy gui

      - name: Configure CMake
        if: runner.os != 'Windows'
        run: |
          CMAKE_ARGS=(-S . -B build -G Ninja -DCARVERA_FIRMWARE_ROOT="$FIRMWARE_ROOT")
          cmake "${CMAKE_ARGS[@]}"

      - name: Build and run C++ tests
        if: runner.os != 'Windows'
        run: cmake --build build --target check --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}

      - name: Build and test under WSL
        if: runner.os == 'Windows'
        shell: wsl-bash {0}
        run: |
          git config --global --add safe.directory "$(pwd)"
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v uv >/dev/null; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          JOBS="$(python3 -c 'import os; print(os.cpu_count() or 4)')"
          FIRMWARE_ROOT="$(bash scripts/ensure_firmware_checkout.sh)"
          uv sync --python "$(command -v python3)"
          uv run python -m gui.protocol.proto_codegen
          uv run ruff format --check gui
          uv run ruff check gui
          uv run mypy gui
          cmake -S . -B build -G Ninja -DCARVERA_FIRMWARE_ROOT="$FIRMWARE_ROOT"
          cmake --build build --target carvera_sim_stdio carvera_sim_stream_stdio carvera_sim_interactive --parallel "$JOBS"
          uv run pytest gui/tests -m "not integration" --ignore=gui/tests/app_runtime_page_test.py

      - name: Run GUI tests
        if: runner.os != 'Windows'
        run: uv run pytest gui/tests
