name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: ubuntu-24.04
          - os: macos-15
            name: macos-15 / ARM64

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        if: runner.os == 'macOS'
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v7
        if: runner.os == 'macOS'
        with:
          enable-cache: true

      - name: Build and test on Ubuntu 24.04
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ubuntu:24.04 \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                cmake \
                curl \
                git \
                libprotobuf-dev \
                ninja-build \
                protobuf-compiler \
                python3 \
                python3-venv
              export PATH="$HOME/.local/bin:$PATH"
              if ! command -v uv >/dev/null; then
                curl -LsSf https://astral.sh/uv/install.sh | sh
              fi
              export PATH="$HOME/.local/bin:$PATH"
              JOBS="$(python3 -c "import os; print(os.cpu_count() or 4)")"
              FIRMWARE_ROOT="$(bash scripts/ensure_firmware_checkout.sh)"
              uv sync --python "$(command -v python3)"
              uv run python -m gui.protocol.proto_codegen
              uv run ruff format --check gui
              uv run ruff check gui
              uv run mypy gui
              cmake -S . -B build -G Ninja \
                -DCARVERA_FIRMWARE_ROOT="$FIRMWARE_ROOT" \
                -DCARVERA_SIM_ENABLE_COVERAGE=ON \
                -DCARVERA_SIM_COVERAGE_OUTPUT_DIRECTORY=/work/coverage
              cmake --build build --target coverage --parallel "$JOBS"
              uv run pytest gui/tests
            '

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install cmake ninja protobuf

      - name: Fetch compatible firmware
        if: runner.os == 'macOS'
        run: echo "FIRMWARE_ROOT=$(scripts/ensure_firmware_checkout.sh)" >> "$GITHUB_ENV"

      - name: Detect build parallelism
        if: runner.os == 'macOS'
        run: python -c "import os; open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write(f'CMAKE_BUILD_PARALLEL_LEVEL={os.cpu_count() or 4}\n')"

      - name: Sync Python environment
        if: runner.os == 'macOS'
        run: uv sync

      - name: Generate Python protobuf bindings
        if: runner.os == 'macOS'
        run: uv run python -m gui.protocol.proto_codegen

      - name: Check Python
        if: runner.os == 'macOS'
        run: |
          uv run ruff format --check gui
          uv run ruff check gui
          uv run mypy gui

      - name: Configure CMake
        if: runner.os == 'macOS'
        run: |
          CMAKE_ARGS=(-S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCARVERA_FIRMWARE_ROOT="$FIRMWARE_ROOT")
          cmake "${CMAKE_ARGS[@]}"

      - name: Build and run C++ tests
        if: runner.os == 'macOS'
        run: cmake --build build --target check --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}

      - name: Run GUI tests
        if: runner.os == 'macOS'
        run: uv run pytest gui/tests

      - name: Build macOS desktop app
        if: runner.os == 'macOS'
        env:
          CARVERA_SIM_PACKAGE_BUILD_DIR: ${{ github.workspace }}/build
        run: scripts/build_macos_app.sh

      - name: Upload macOS desktop app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Carvera-Simulator-macOS-arm64
          path: dist/macos/Carvera-Simulator-macOS-arm64.dmg
          if-no-files-found: error

      - name: Add coverage summary
        if: runner.os == 'Linux' && always() && hashFiles('coverage/summary.md') != ''
        run: cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: runner.os == 'Linux' && always() && hashFiles('coverage/summary.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ubuntu-24.04
          path: coverage
          if-no-files-found: error

  windows-app:
    name: Windows 10-compatible desktop app / x64
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-protobuf

      - name: Check native Windows Python code
        shell: pwsh
        run: |
          uv sync --locked --python 3.13
          uv run ruff format --check gui
          uv run ruff check gui
          uv run mypy gui
          uv run pytest gui/tests -m "not integration" `
            --ignore=gui/tests/app_runtime_page_test.py `
            --ignore=gui/tests/firmware_checkout_test.py `
            --ignore=gui/tests/linux_appimage_packaging_test.py `
            --ignore=gui/tests/sim_client_stream_reader_test.py

      - name: Build native Windows desktop app
        shell: pwsh
        env:
          CARVERA_SIM_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          CARVERA_SIM_PACKAGE_BUILD_DIR: ${{ github.workspace }}\build-windows
        run: scripts\build_windows_app.ps1

      - name: Test native and packaged Windows backends
        shell: pwsh
        run: |
          $SystemPath = $env:Path
          $env:Path = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;$SystemPath"
          uv run pytest gui/tests/stream_integration_test.py -q
          $env:Path = $SystemPath
          $env:CARVERA_SIMULATOR_BINARY = "${{ github.workspace }}\dist\windows\Carvera Simulator\_internal\bin\carvera_sim_stream_stdio.exe"
          uv run pytest gui/tests/stream_integration_test.py -q

      - name: Create Windows desktop archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\windows\Carvera Simulator" `
            -DestinationPath "dist\windows\Carvera-Simulator-Windows-x64.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows desktop app
        uses: actions/upload-artifact@v4
        with:
          name: Carvera-Simulator-Windows-x64
          path: dist/windows/Carvera-Simulator-Windows-x64.zip
          if-no-files-found: error

  linux-appimage:
    name: Linux AppImage / ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
            artifact: Carvera-Simulator-Linux-amd64.AppImage
          - runner: ubuntu-24.04-arm
            architecture: arm64
            artifact: Carvera-Simulator-Linux-arm64.AppImage

    steps:
      - uses: actions/checkout@v5

      - name: Build and smoke-test native AppImage
        env:
          CARVERA_SIM_CONTAINER_ENGINE: docker
          CARVERA_SIM_EXPECTED_ARTIFACT_ARCHITECTURE: ${{ matrix.architecture }}
        run: scripts/build_linux_appimage_container.sh

      - name: Upload Linux desktop app
        uses: actions/upload-artifact@v4
        with:
          name: Carvera-Simulator-Linux-${{ matrix.architecture }}
          path: dist/linux/${{ matrix.artifact }}
          if-no-files-found: error

  release-dev:
    name: Publish development release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, linux-appimage, windows-app]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: dev-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5

      - name: Download application artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: Carvera-Simulator-*
          path: release-assets
          merge-multiple: true

      - name: Publish rolling development release
        run: |
          mapfile -d '' -t ASSETS < <(find release-assets -type f -print0)
          if (( ${#ASSETS[@]} == 0 )); then
            echo "error: no application artifacts were downloaded" >&2
            exit 1
          fi

          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$REMOTE_MAIN" != "$GITHUB_SHA" ]]; then
            echo "Skipping stale run for $GITHUB_SHA; main is now $REMOTE_MAIN"
            exit 0
          fi

          REMOTE_DEV="$(git ls-remote origin refs/tags/dev | cut -f1)"
          git tag --force dev "$GITHUB_SHA"
          git push --force-with-lease="refs/tags/dev:$REMOTE_DEV" origin refs/tags/dev

          NOTES="Automatic development build from commit $GITHUB_SHA. This prerelease is replaced after every successful push to main."
          if gh release view dev >/dev/null 2>&1; then
            gh release edit dev \
              --title "Development Build" \
              --notes "$NOTES" \
              --prerelease \
              --target "$GITHUB_SHA"
          else
            gh release create dev \
              --title "Development Build" \
              --notes "$NOTES" \
              --prerelease \
              --latest=false \
              --verify-tag
          fi

          gh release upload dev "${ASSETS[@]}" --clobber

          declare -A CURRENT_ASSETS=()
          for asset in "${ASSETS[@]}"; do
            CURRENT_ASSETS["$(basename "$asset")"]=1
          done
          while IFS= read -r existing_asset; do
            if [[ -n "$existing_asset" && -z "${CURRENT_ASSETS[$existing_asset]+present}" ]]; then
              gh release delete-asset dev "$existing_asset" --yes
            fi
          done < <(gh release view dev --json assets --jq '.assets[].name')
